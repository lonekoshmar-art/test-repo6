<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Starmaker</title>
  <meta name="description" content="Draw your own constellations on a twinkling night sky.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <canvas id="sky" aria-label="Night sky drawing canvas"></canvas>

  <header class="topbar">
    <div class="brand"><span aria-hidden="true">✦</span> Starmaker</div>
    <nav class="tools" aria-label="Tools">
      <button class="btn" id="btn-random" type="button" title="New random constellation (R)">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
        <span class="label">Random</span>
      </button>
      <button class="btn" id="btn-undo" type="button" title="Undo (Ctrl+Z)">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        <span class="label">Undo</span>
      </button>
      <button class="btn" id="btn-clear" type="button" title="Clear the sky">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        <span class="label">Clear</span>
      </button>
      <span class="sep" aria-hidden="true"></span>
      <button class="btn primary" id="btn-save" type="button" title="Save to gallery (Ctrl+S)">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        <span class="label">Save</span>
      </button>
      <button class="btn" id="btn-export" type="button" title="Download as PNG (P)">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span class="label">PNG</span>
      </button>
      <button class="btn" id="btn-share" type="button" title="Copy a share link (L)">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        <span class="label">Share</span>
      </button>
      <button class="btn" id="btn-gallery" type="button" title="Your saved constellations (G)" aria-expanded="false" aria-controls="gallery">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span class="label">Gallery</span>
        <span class="badge" id="gallery-count"></span>
      </button>
    </nav>
  </header>

  <section class="plate" aria-label="Constellation details">
    <div class="plate-row">
      <input id="name" type="text" maxlength="48" placeholder="Untitled constellation" autocomplete="off" spellcheck="false" aria-label="Constellation name">
      <button class="icon-btn" id="btn-name" type="button" title="New name and lore (N)" aria-label="Generate a new name">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      </button>
    </div>
    <p id="lore"></p>
    <p id="stats"></p>
  </section>

  <ul class="hint" id="hint" aria-label="How to draw">
    <li><b>Click</b><span>place a star</span></li>
    <li><b>Drag</b><span>connect stars (again to unlink)</span></li>
    <li><b>Shift + drag</b><span>move a star</span></li>
    <li><b>Hold / right-click</b><span>remove a star</span></li>
    <li><b>Scroll</b><span>change a star's brightness</span></li>
    <li><b>H</b><span>hide / show this guide</span></li>
  </ul>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <aside class="gallery" id="gallery" aria-label="Saved constellations" inert>
    <header>
      <h2>Your sky</h2>
      <button class="icon-btn" id="btn-close-gallery" type="button" aria-label="Close gallery">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </header>
    <ul id="gallery-list"></ul>
  </aside>

  <script src="app.js"></script>
</body>
</html>
